<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">gentle-herdr — Herdr visuals for Gentle Shell</title>
  <desc id="banner-desc">A dark plum banner with a neon-outlined ram, its curled horn and a terminal prompt for an eye, holding the neon Gentle Shell rose, next to the gentle-herdr wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120d16"/><stop offset=".55" stop-color="#251124"/><stop offset="1" stop-color="#0b0910"/></linearGradient>
    <linearGradient id="rule" x1="0" x2="1"><stop stop-color="#f095c8" stop-opacity="0"/><stop offset=".18" stop-color="#f095c8"/><stop offset=".72" stop-color="#d7a0b8"/><stop offset="1" stop-color="#f095c8" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#ff4f9a" stop-opacity=".22"/><stop offset="1" stop-color="#ff4f9a" stop-opacity="0"/></radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>
  <path d="M54 54H1146M54 346H1146" stroke="url(#rule)" stroke-width="2"/>

  <g transform="translate(70 10)">
    <circle cx="180" cy="190" r="170" fill="url(#halo)"/>

    <!-- Ram: head and wool, neon outline -->
    <g filter="url(#neon)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M48 196 C44 170 70 140 110 124 C130 116 150 112 168 112 Q178 92 200 96 Q214 80 236 88 Q258 80 272 98 Q296 100 300 124 Q318 138 308 160 Q322 178 308 198 Q318 222 298 236 Q300 262 276 268 Q262 290 236 284 Q216 302 194 290 Q170 300 156 282 Q134 282 132 260 C130 244 118 232 100 228 C84 224 70 222 60 216 C52 211 49 204 48 196 Z"
        fill="#1c1019" stroke="#ff4f9a" stroke-width="4"/>
      <!-- curled horn -->
      <path d="M150 120 C148 92 182 80 206 92 C232 106 234 144 212 158 C192 171 168 160 168 140 C168 125 183 118 194 124 C203 129 201 141 192 143"
        fill="none" stroke="#f095c8" stroke-width="12"/>
      <!-- prompt eye -->
      <path d="M88 152 l12 9 -12 9" fill="none" stroke="#fff7f1" stroke-width="5"/>
      <path d="M108 171 h13" fill="none" stroke="#fff7f1" stroke-width="5"/>
    </g>

    <!-- Gentle Shell rose at the ram's mouth -->
    <g transform="translate(58 238) scale(1.15)" filter="url(#neon)" stroke-linecap="round" stroke-linejoin="round" fill="#1c1019">
      <path d="M0 18 C2 40 -4 60 -2 84" fill="none" stroke="#ff4f9a" stroke-width="3"/>
      <path d="M-1 46 C-22 36 -34 44 -36 54 C-22 58 -8 56 -1 46 Z" stroke="#ff4f9a" stroke-width="2.4"/>
      <path d="M-1 46 L-26 51" fill="none" stroke="#ff7fb6" stroke-width="1.4"/>
      <path d="M0 64 C18 56 30 62 32 72 C20 76 6 74 0 64 Z" stroke="#ff4f9a" stroke-width="2.4"/>
      <path d="M0 64 L24 70" fill="none" stroke="#ff7fb6" stroke-width="1.4"/>
      <path d="M-18 -14 C-34 -16 -40 4 -26 14 C-16 22 -4 22 0 18 C4 22 16 22 26 16 C40 6 38 -14 22 -14 C18 -34 -18 -32 -18 -14 Z" stroke="#ff4f9a" stroke-width="3"/>
      <path d="M-18 -14 C-16 -4 -8 2 2 2 C12 2 20 -4 22 -14" fill="none" stroke="#ff4f9a" stroke-width="2.4"/>
      <path d="M-26 14 C-18 6 -14 -2 -14 -6 M26 16 C18 8 16 0 16 -6" fill="none" stroke="#ff4f9a" stroke-width="2"/>
      <path d="M-6 -12 C-14 -18 -2 -28 10 -22 C18 -16 12 -4 2 -6 C-4 -8 -2 -15 4 -14" fill="none" stroke="#ff7fb6" stroke-width="2.4"/>
    </g>
    <g fill="#ff7fb6">
      <circle cx="10" cy="214" r="2.2"/><circle cx="112" cy="226" r="1.8"/><circle cx="106" cy="300" r="2"/><circle cx="16" cy="312" r="1.6"/><circle cx="104" cy="262" r="1.4"/>
    </g>
  </g>

  <text x="470" y="190" fill="#fff7f1" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="76" font-weight="700">gentle<tspan fill="#ff4f9a">-</tspan>herdr</text>
  <path d="M474 214H1090" stroke="#f095c8" stroke-opacity=".35" stroke-width="2"/>
  <text x="474" y="260" fill="#d7a0b8" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="25">Gentle Shell colors for Herdr, on every machine.</text>
  <text x="474" y="304" fill="#a78e9b" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22">&gt; /gentle:herdr</text>
</svg>
